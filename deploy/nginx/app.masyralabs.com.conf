server {
    listen 80;
    listen [::]:80;
    server_name app.masyralabs.com;

    access_log /var/log/nginx/app.masyralabs.com.access.log;
    error_log /var/log/nginx/app.masyralabs.com.error.log;

    # Required: protect the dashboard before exposing it publicly.
    auth_basic "Masyra Labs Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-masyra-labs;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/masyra-labs;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
